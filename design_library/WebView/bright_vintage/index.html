<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIGHT VINTAGE - Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="plugin-container">
            <!-- Screws -->
            <div class="screw tl"></div>
            <div class="screw tr"></div>
            <div class="screw bl"></div>
            <div class="screw br"></div>

            <!-- Header -->
            <div class="plugin-header">
                <div class="plugin-title">
                    BRIGHT VINTAGE
                    <small>VINTAGE ANALOG SERIES</small>
                </div>
                <div class="led-group">
                    <div class="led on"></div>
                    <span class="led-label">POWER</span>
                </div>
            </div>

            <!-- Body -->
            <div class="plugin-body">
                <!-- Left Column -->
                <div class="left-section">

                    <!-- Filter Section -->
                    <div class="panel-box">
                        <span class="panel-label">FILTER</span>
                        <div class="controls-row">

    <div class="knob-container">
        <div class="knob">
            <div class="knob-body"></div>
            <div class="knob-cap"></div>
            <div class="knob-pointer"></div>
        </div>
        <span class="knob-label">CUTOFF</span>
        <span class="knob-value">0.50</span>
    </div>

    <div class="knob-container">
        <div class="knob">
            <div class="knob-body"></div>
            <div class="knob-cap"></div>
            <div class="knob-pointer"></div>
        </div>
        <span class="knob-label">RES</span>
        <span class="knob-value">0.50</span>
    </div>

    <div class="knob-container">
        <div class="knob">
            <div class="knob-body"></div>
            <div class="knob-cap"></div>
            <div class="knob-pointer"></div>
        </div>
        <span class="knob-label">DRIVE</span>
        <span class="knob-value">0.50</span>
    </div>
                        </div>
                    </div>

                    <!-- Envelope Section -->
                    <div class="panel-box">
                        <span class="panel-label">ENVELOPE</span>
                        <div class="controls-row" style="align-items: flex-end; height: 110px; padding: 0 24px;">

    <div class="fader-container" style="height: 100%;">
        <div class="fader-track">
            <div class="fader-fill"></div>
            <div class="fader-handle"></div>
        </div>
        <span class="fader-label">A</span>
    </div>

    <div class="fader-container" style="height: 100%;">
        <div class="fader-track">
            <div class="fader-fill"></div>
            <div class="fader-handle"></div>
        </div>
        <span class="fader-label">D</span>
    </div>

    <div class="fader-container" style="height: 100%;">
        <div class="fader-track">
            <div class="fader-fill"></div>
            <div class="fader-handle"></div>
        </div>
        <span class="fader-label">S</span>
    </div>

    <div class="fader-container" style="height: 100%;">
        <div class="fader-track">
            <div class="fader-fill"></div>
            <div class="fader-handle"></div>
        </div>
        <span class="fader-label">R</span>
    </div>
                        </div>
                    </div>

                </div>

                <!-- Right Column (Master) -->
                <div class="right-section">
                     <div class="panel-box" style="flex: 1; display: flex; flex-direction: column; align-items: center; min-height: 0;">
                        <span class="panel-label">MASTER</span>
                        <div class="controls-row" style="gap: 18px; height: 100%; flex: 1; align-items: flex-end; padding-bottom: 16px;">

    <div class="fader-container" style="height: 100%;">
        <div class="fader-track">
            <div class="fader-fill"></div>
            <div class="fader-handle"></div>
        </div>
        <span class="fader-label">MIX</span>
    </div>

                            <!-- Vintage LED Meter -->
                            <div class="v-meter">
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led on"></div>
                                <div class="v-meter-led"></div>
                            </div>
                        </div>
                     </div>

                     <div class="panel-box" style="height: 92px; display: flex; align-items: center; justify-content: space-around; padding: 0 12px;">
                        <span style="font-size: 18px; color: var(--amber);">⚡</span>

    <div class="knob-container">
        <div class="knob small">
            <div class="knob-body"></div>
            <div class="knob-cap"></div>
            <div class="knob-pointer"></div>
        </div>
        <span class="knob-label">VOL</span>
        <span class="knob-value">0.50</span>
    </div>
                     </div>
                </div>

            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-text">CPU: 1%</div>
                <div class="footer-text">JUCE WEBVIEW 8</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
